name: CI

on:
  push:
    branches: [main, revive/modernize-and-deploy]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies and audit tools
        run: python -m pip install -r requirements.txt bandit==1.9.4 pip-audit==2.10.1
      - name: Test and check migrations
        env:
          DJANGO_DEBUG: "true"
        run: |
          python manage.py test
          python manage.py makemigrations --check --dry-run
      - name: Check production configuration
        env:
          DJANGO_SECRET_KEY: ci-only-signing-key-not-valid-outside-this-workflow-0123456789
          DJANGO_ALLOWED_HOSTS: riot.spencerreyka.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://riot.spencerreyka.com
          DATABASE_URL: postgresql://riot:unused@127.0.0.1:5432/riot
          RIOT_API_KEY_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        run: |
          python manage.py check --deploy
          python manage.py collectstatic --noinput
      - name: Scan Python code and dependencies
        run: |
          bandit -q -r manage.py riot_api stats
          pip-audit -r requirements.txt

  container:
    runs-on: ubuntu-latest
    needs: application
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production image
        run: docker build --tag riot-match-analysis:ci .
      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: riot-match-analysis:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
