services:
  app:
    build: .
    env_file: .env
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      RIOT_API_KEY_ENCRYPTION_KEY: ${RIOT_API_KEY_ENCRYPTION_KEY:-}
      RIOT_DEFAULT_PLATFORM: ${RIOT_DEFAULT_PLATFORM:-na1}
      RIOT_DEFAULT_ROUTING: ${RIOT_DEFAULT_ROUTING:-americas}
      RIOT_MATCH_COUNT: ${RIOT_MATCH_COUNT:-20}
      DPS_THREAT_THRESHOLD: ${DPS_THREAT_THRESHOLD:-1800}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: riot
      POSTGRES_USER: riot
    volumes:
      - riot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riot -d riot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  riot_postgres_data:
